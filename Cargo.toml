[package]
name = "cadical-sys"
description = "Safe bindings for the CaDiCaL SAT solver, made with the cxx crate and wrapped in a 1 to 1 API."
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
links = "cadical"
repository = "https://github.com/sirandreww/cadical-sys.git"
authors = ["Andrew Luka"]
categories = ["api-bindings", "development-tools::ffi", "external-ffi-bindings"]
keywords = ["cadical", "sat-solver", "bindings", "system-level", "safe"]
readme = "README.md"

[dependencies]
cxx = "1.0.204"

[build-dependencies]
cc = "1.7.0"
cxx-build = "1.0.204"

[dev-dependencies]
rand = "0.10.3"
version-sync = "0.9.5"